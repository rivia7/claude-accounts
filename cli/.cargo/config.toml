# 从 macOS 交叉编译 Linux 的 helper（静态链接 musl）：用 Rust 自带的 rust-lld 链接，不用装别的工具链。
#   cargo build --release --locked --target x86_64-unknown-linux-musl
#   cargo build --release --locked --target aarch64-unknown-linux-musl
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

# cargo test / cargo run 起的进程绝不碰真的 ~/.cca：没另外指定时，CCA_HOME 指到一个不存在的目录
# （tests/ 的 suite 各个模块、回归直接跑 target/ 下的程序，用的是它们自己的临时 HOME，不经这里）
[env]
CCA_HOME = { value = "/nonexistent/cca-unit-tests", force = false }
