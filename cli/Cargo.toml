[package]
name = "cca-core"
version = "0.0.0"          # 不单独发布：版本号跟着 cca 脚本里的 VERSION
edition = "2021"
rust-version = "1.100"
publish = false
description = "cca 的辅助程序：bash 里的「py 子命令 参数…」运行的就是它"
license = "MIT"

[[bin]]
name = "cca-core"
path = "src/main.rs"

# 依赖只用这几个常见的纯 Rust 库（见 docs/dev/rust.md 的「依赖」）：加新的之前先问维护者。版本由 Cargo.lock 锁定，构建一律 --locked
[dependencies]
libc = "0.2"
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }   # zlib：折合金额和别的设备交换的那一份是压缩的
regex ={ version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case", "unicode-gencat"] }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
unicode-normalization = { version = "0.1", default-features = false, features = ["std"] }

# TLS 和签名：Team 的同步服务器（team-server，跑在 Linux 上）要 TLS、要验设备的签名（Ed25519），证书助手（team-acme）要连证书机构、
# 给请求签名（ECDSA P-256）；邮箱助手连 Gmail 的 IMAP 也要 TLS（只在 macOS 上有，证书照系统的 /etc/ssl/cert.pem 验）。
# ring 里有 C 和汇编：从 macOS 交叉编译 Linux 的两个目标前先 source cli/musl-env.sh
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# tests/ 是同一个 workspace 里的另一个包（回归用的小工具 cca-test 和各份测试；不用这里的代码）：共用 Cargo.lock 和 target/。
# 不带 -p 的命令照旧只管辅助程序：cargo build --release --locked 出来的还是 target/release/cca-core
[workspace]
members = [".", "../tests"]
default-members = ["."]
resolver = "2"

[profile.release]
opt-level = 2
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev]
panic = "abort"            # 和发布版一样：没人接的 panic 走 main 的钩子，退出码 1

# tests/ 那个包用这一档（cargo build / test --profile kit -p cca-tests）：panic 要接得住（一个用例 panic 不该带走整个进程），
# 自己的代码少优化一点、编得快；依赖照发布版优化（不然 PBKDF2、TLS 慢好多倍）
[profile.kit]
inherits = "dev"
panic = "unwind"
opt-level = 1
debug = "line-tables-only"

[profile.kit.package."*"]
opt-level = 3
debug = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
# 移植时逐行对着 Python 写，这几条会逼着改写法、反而对不上原文
too_many_arguments = "allow"
type_complexity = "allow"
new_without_default = "allow"
len_without_is_empty = "allow"
