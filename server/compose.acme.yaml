# 网页端的证书助手（server/cca-acme.py，docs/dev/remote.md「网页端」）：向 Let's Encrypt 要浏览器信得过的证书（给 IP 地址的是约 6 天的
# 短期证书），过了一半有效期就续，写进 webcert/（cca-presence 隔一会儿看一次，自己换上，不用重启）。在 compose.yaml、compose.web.yaml
# 上面再加的一个容器。./policy.sh presence deploy … --web-url https://地址[:端口]/ --web-acme 打开它：往 .env 里写 CCA_ACME=on、
# CCA_ACME_ID（要证书的地址：网页端地址里的那个 IP 或者域名），COMPOSE_FILE 带上这个文件；--web-cert、--web-key（自己放证书）、
# --no-web 关掉它。
# 证书机构验证时从公网连这台服务器的 80 端口：80 端口给它（安全组里要放行 TCP 80），别的路径一律 404。
#   acme/      证书机构那里的账户的私钥（续证书用的是同一个账户）
#   webcert/   fullchain.pem、privkey.pem（证书的私钥续的时候不换）
services:
  cca-acme:
    image: ${CCA_PRESENCE_IMAGE:-python:3.13-slim}
    container_name: cca-acme
    restart: unless-stopped
    user: "10001:10001"
    command: ["python3", "-I", "/app/cca-acme.py", "--id", "${CCA_ACME_ID:?先用 ./policy.sh presence deploy --web-url … --web-acme 打开证书助手}",
              "--out", "/webcert", "--account", "/acme", "--listen", "0.0.0.0:18080"]
    ports:
      - "80:18080"
    volumes:
      - ./app:/app:ro
      - ./webcert:/webcert
      - ./acme:/acme
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: Asia/Shanghai
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
